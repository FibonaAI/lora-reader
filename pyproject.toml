[project]
name = "lora-reader"
version = "0.1.0"
description = "Can a general LLM read a LoRA weight diff zero-shot and say what it implants? Evaluated on DIT's hidden-topic and news-summary benchmarks."
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx[socks]>=0.28.1",
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "jupyter-client>=8.10.0",
    "pandas>=2.2",
    "torch>=2.7.1,<2.8",
    "transformers==4.57.1",
]
